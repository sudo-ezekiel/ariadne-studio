name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # agent-device's daemon sometimes stalls at start on Windows, so several fresh
  # machines say how often. The studio has to survive it on a tester's computer.
  windows-start:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ariadne-studio... build
      - run: node scripts/windows-check.mjs

  # Most testers start here, and no developer machine here runs Windows.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-bail test
      # These answer a different question from the tests, so they run either way.
      # With its dependencies: the CLI bundles the studio's UI.
      - run: pnpm --filter ariadne-studio... build
        if: ${{ !cancelled() }}
      - run: node scripts/windows-check.mjs
        if: ${{ !cancelled() }}
