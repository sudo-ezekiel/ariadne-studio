<!doctype html>
<!-- The share image, drawn by brand-images.mjs at 1200x630. The frame is a real run video frame.
     The headline and its ochre thread copy the landing page's hero (site/index.html, site.css), without the animation. -->
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Host Grotesk";
    font-style: normal;
    font-weight: 300 800;
    src: url("../../site/fonts/host-grotesk-latin-wght-normal.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1c2b4a; }
  body { position: relative; font-family: "Host Grotesk", system-ui, sans-serif; color: #fff; }
  .text { position: absolute; left: 64px; top: 142px; width: 432px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 650; letter-spacing: -0.02em; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 44px 0 0; font-size: 52px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; }
  p { margin: 34px 0 0; font-size: 24px; line-height: 1.3; color: #e8b43a; font-weight: 550; white-space: nowrap; }
  /* The ochre thread under "by using your app": a ring where it starts, a knot where it ends */
  .thread-words { position: relative; display: inline-block; white-space: nowrap; }
  .thread-line { position: absolute; left: 0.04em; right: 0.04em; bottom: -0.27em; height: 0.34em; }
  .thread-line svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .thread-line path { fill: none; stroke: #e8b43a; stroke-width: 3px; stroke-linecap: round; }
  .thread-ring, .thread-knot { position: absolute; width: 12px; height: 12px; border-radius: 50%; }
  .thread-ring { left: -6px; top: calc(20% - 6px); border: 2.5px solid #e8b43a; background: #1c2b4a; }
  .thread-knot { right: -6px; top: calc(40% - 6px); background: #e8b43a; }
  .frame {
    position: absolute;
    left: 512px;
    top: 132px;
    width: 660px;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(8, 13, 26, 0.55);
  }
</style>
<div class="text">
  <div class="brand"><img src="../../site/favicon.svg" alt=""><span>Ariadne</span></div>
  <h1>Record<br>Maestro flows<br><span class="thread-words">by using your app<span class="thread-line"><svg viewBox="0 0 300 20" preserveAspectRatio="none"><path d="M1 4 C 60 15, 140 19, 212 13 S 282 3, 299 8" vector-effect="non-scaling-stroke"/></svg><span class="thread-ring"></span><span class="thread-knot"></span></span></span></h1>
  <p>A no-code test recorder for Android</p>
</div>
<img class="frame" src="../../site/media/run-poster.png" alt="">
