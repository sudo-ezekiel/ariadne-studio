<!doctype html>
<!-- The share image, drawn by brand-images.mjs at 1200x630. The frame is a real run video frame. -->
<meta charset="utf-8">
<style>

  body { position: relative; font-family: "Noto Sans", system-ui, sans-serif; color: #fff; }
  .thread { position: absolute; left: 0; top: 0; width: 8px; height: 100%; background: #e8b43a; }
  .text { position: absolute; left: 64px; top: 64px; width: 420px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 48px 0 0; font-size: 56px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 24px 0 0; font-size: 26px; line-height: 1.3; color: #e8b43a; font-weight: 600; }
  .frame {
    position: absolute;
    left: 512px;
    top: 132px;
    width: 660px;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(8, 13, 26, 0.55);
  }
</style>
<div class="thread"></div>
<div class="text">
  <div class="brand"><img src="../../site/favicon.svg" alt=""><span>Ariadne</span></div>
